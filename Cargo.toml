[package]
name = "tablet-input-windows"
version = "0.1.0"
edition = "2024"
description = "Framework-independent Windows pen input through WM_POINTER"
readme = "README.md"
license = "MIT"
repository = "https://github.com/nope-e/tablet-input-windows"
homepage = "https://github.com/nope-e/tablet-input-windows"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]

[target.'cfg(windows)'.dependencies]
thiserror = "2"
windows = { version = "0.62.2", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62.2", features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }
